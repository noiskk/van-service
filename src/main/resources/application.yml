spring:
  application:
    name: VAN-service

  # Feign 타임아웃 — 응답 없는 하위 서비스에 매달려 있지 않게 한다.
  # 타임아웃이 나야 '불확실 거래'로 분류되고 대사 대상이 된다.
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 3000


server:
  port: 7070
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# 카드사(외부 회사) 게이트웨이 — VAN은 카드사 내부 서비스를 직접 알지 않는다
card:
  issuer:
    url: ${CARD_ISSUER_URL:http://localhost:9000}

logging:
  level:
    com.card.payment: DEBUG

# Swagger/OpenAPI 설정
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha

