spring:
  application:
    name: VAN-service

server:
  port: 7070
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# 카드사(외부 회사) 게이트웨이 — VAN은 카드사 내부 서비스를 직접 알지 않는다
card:
  issuer:
    url: ${CARD_ISSUER_URL:http://localhost:9000}

logging:
  level:
    com.card.payment: DEBUG

# Swagger/OpenAPI 설정
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha