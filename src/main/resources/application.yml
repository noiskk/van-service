spring:
  application:
    name: VAN-service

  thymeleaf:
    cache: false

  # Feign 타임아웃 — 응답 없는 하위 서비스에 매달려 있지 않게 한다.
  # 타임아웃이 나야 '불확실 거래'로 분류되고 대사 대상이 된다.
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 3000


server:
  port: 7070
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# 카드사 라우팅 테이블
# VAN은 카드번호 앞자리(BIN)로 발급 카드사를 판별해 해당 카드사로 전문을 보낸다.
# 카드사 추가·BIN 대역 변경은 일상적인 일이라 코드가 아니라 설정으로 둔다.
van:
  routing:
    issuers:
      - code: A_CARD
        name: 에이카드
        url: ${CARD_ISSUER_URL:http://localhost:9000}
        enabled: true
        bins:
          - "411111"
          - "555555"
          - "601111"
          - "353011"
          - "510510"
          - "401288"

      # 연동 예정 카드사 — 라우팅 대상은 되지만 실제 서버는 아직 없다.
      # 라우팅이 정말로 대상을 바꾸는지 확인할 때 쓴다(96 하위 서비스 호출 실패로 떨어짐).
      - code: B_CARD
        name: 비카드
        url: http://localhost:9100
        enabled: true
        bins:
          - "622222"

logging:
  level:
    com.card.payment: DEBUG

# Swagger/OpenAPI 설정
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha

